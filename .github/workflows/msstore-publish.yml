# name: msstore-publish
#
# # Publishes the MSIX build of the tagged release to the Microsoft
# # Store. Intentionally a SEPARATE workflow from release.yml: both
# # trigger on the same `v*` tag and run concurrently, so the slow
# # Store submission (baseline validation blocks in-job; full
# # certification takes hours/days) can never delay or fail the
# # zip / SHA-256 / R2 mirror / GitHub-Release assets that release.yml
# # produces. Wall-clock is max(build, publish), not the sum.
# on:
#   push:
#     tags: ['v*']
#
# # This workflow only reads the repo (checkout) and calls the Store
# # API; it creates no releases and pushes nothing back, so the default
# # write scopes of GITHUB_TOKEN are narrowed to read-only.
# permissions:
#   contents: read
